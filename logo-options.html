<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로고 시안 — SJC 커스텀 모노그램 실버</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e8e8ea;
      padding: 3rem 2rem;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .sub {
      text-align: center;
      color: #9aa0a8;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }
    .sub strong {
      background: linear-gradient(135deg, #e5e7eb, #94a3b8, #475569);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hint {
      text-align: center;
      color: #6b7280;
      font-size: 0.78rem;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1a1d23;
      border: 1px solid #2a2e36;
      border-radius: 14px;
      padding: 1.8rem 1.5rem 1.5rem;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: #94a3b8;
      transform: translateY(-2px);
    }
    .label {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1.2rem;
    }
    .num {
      background: linear-gradient(135deg, #e5e7eb, #94a3b8 50%, #475569);
      color: #0d1117;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.85rem;
    }
    .name { font-size: 1rem; font-weight: 700; }
    .tag {
      margin-left: auto;
      font-size: 0.7rem;
      color: #6b7280;
      background: #2a2e36;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }
    .preview {
      background: #15171c;
      border-radius: 10px;
      padding: 1.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 1rem;
      margin-bottom: 0.7rem;
    }
    .preview-context {
      background: linear-gradient(135deg, #fafafa 0%, #e5e7eb 100%);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      gap: 1.5rem;
    }
    .preview-context svg { width: 80px; height: 80px; }
    .preview-context-label {
      font-size: 0.7rem;
      color: #6b7280;
      letter-spacing: 0.04em;
    }
    .preview-small, .preview-med, .preview-large {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }
    .preview-small svg { width: 28px; height: 28px; }
    .preview-med svg { width: 64px; height: 64px; }
    .preview-large svg { width: 130px; height: 130px; }
    .size-label {
      font-size: 0.65rem;
      color: #6b7280;
      letter-spacing: 0.04em;
    }
    .desc {
      font-size: 0.82rem;
      color: #9aa0a8;
      line-height: 1.55;
    }
    .desc .meaning {
      display: block;
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed #2a2e36;
      color: #c0c8d4;
      font-size: 0.74rem;
    }
    .pick {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #2a2e36;
      color: #9aa0a8;
      font-size: 0.95rem;
    }
    .pick strong {
      background: linear-gradient(135deg, #e5e7eb, #94a3b8, #475569);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 1.15rem;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <h1>SJC 커스텀 모노그램 · 실버 메탈릭</h1>
  <p class="sub">
    모든 글자를 <strong>폰트가 아닌 SVG 곡선으로 직접 그려서</strong> 디자인된 마크처럼 표현했습니다.
    S·J·C가 서로 겹치거나 선을 공유하면서 하나의 작품으로 융합됩니다.
  </p>
  <p class="hint">검은 배경(앱) / 밝은 배경(인쇄) 두 환경에서 모두 미리보기 표시</p>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="silver-d" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="30%" stop-color="#cbd5e1"/>
        <stop offset="55%" stop-color="#f1f5f9"/>
        <stop offset="80%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
      <linearGradient id="silver-dark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#64748b"/>
        <stop offset="50%" stop-color="#334155"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Re-usable SVG snippets defined as JS to avoid repetition -->
  <script>
    /* SJC monogram designs as SVG fragments.
       Each one uses custom <path> elements (no <text>) so the letters
       are actual designed shapes, not typography. */
    const designs = [
      {
        name: '1. Cursive Flow',
        tag: '필기체 흐름',
        meaning: 'S·J·C 세 글자가 단 하나의 흐르는 곡선처럼 이어진 형태. 캘리그래피·서명의 인상.',
        svg: (color) => `
          <g fill="none" stroke="${color}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            <!-- S: top + bottom curve -->
            <path d="M 130 40 C 70 35 60 80 100 95 C 145 105 130 145 75 145"/>
            <!-- J: vertical descender sharing S top, then hook -->
            <path d="M 130 40 L 130 150 Q 130 170 108 170"/>
            <!-- C: arc opening right, overlapping right edge -->
            <path d="M 168 60 Q 110 60 110 100 Q 110 140 168 140"/>
          </g>
        `,
      },
      {
        name: '2. Knot Compose',
        tag: '매듭 · 결속',
        meaning: 'S·J·C 세 형태가 켈틱 매듭처럼 교차하며 결속된 형태. 견고함과 우아함.',
        svg: (color) => `
          <g fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
            <!-- S as zig-zag wave -->
            <path d="M 145 50 L 75 95 L 145 105 L 75 150"/>
            <!-- J as hook crossing through -->
            <path d="M 100 30 L 100 155 Q 100 175 78 168"/>
            <!-- C as right-opening arc -->
            <path d="M 165 55 A 50 50 0 0 0 165 145"/>
          </g>
        `,
      },
      {
        name: '3. Stacked Layers',
        tag: '수직 적층 · 토템',
        meaning: 'S(상)·J(중)·J과 결합된 C(하)가 수직으로 쌓여 단단한 토템 같은 모노그램.',
        svg: (color) => `
          <g fill="none" stroke="${color}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
            <!-- S on top -->
            <path d="M 135 35 C 75 30 70 65 110 75 C 150 85 130 115 70 110"/>
            <!-- J - vertical through middle, hook at bottom of J zone -->
            <path d="M 105 75 L 105 130 Q 105 150 85 148"/>
            <!-- C wrapping around bottom -->
            <path d="M 160 110 Q 100 105 95 145 Q 95 175 165 175"/>
          </g>
        `,
      },
      {
        name: '4. Diamond Compose',
        tag: '다이아 · 결정체',
        meaning: '마름모 프레임 안에서 S·J·C 곡선이 만나는 형태. 균형과 정밀함의 상징.',
        svg: (color) => `
          <g fill="none" stroke="${color}" stroke-linejoin="round" stroke-linecap="round">
            <!-- Diamond frame -->
            <path d="M 100 22 L 178 100 L 100 178 L 22 100 Z" stroke-width="6"/>
            <!-- S -->
            <path d="M 125 65 Q 80 60 80 85 Q 80 105 105 105" stroke-width="13"/>
            <!-- J - vertical with hook -->
            <path d="M 105 65 L 105 130 Q 105 145 88 145" stroke-width="13"/>
            <!-- C - right arc -->
            <path d="M 130 95 Q 130 135 100 135" stroke-width="13"/>
          </g>
        `,
      },
      {
        name: '5. Triangular Trinity',
        tag: '삼각 · 균형',
        meaning: '세 꼭짓점에 S·J·C가 자리한 삼각 구도. 각 글자가 서로를 향하는 균형 잡힌 구성.',
        svg: (color) => `
          <g fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round">
            <!-- Faint triangular guide lines -->
            <path d="M 100 38 L 38 152 L 162 152 Z" stroke-width="4" opacity="0.32"/>
            <!-- S top-vertex -->
            <path d="M 118 38 Q 88 38 88 55 Q 88 72 110 75" stroke-width="12"/>
            <!-- J bottom-left -->
            <path d="M 50 110 L 50 155 Q 50 168 36 168" stroke-width="12"/>
            <!-- C bottom-right -->
            <path d="M 170 125 Q 170 168 140 168" stroke-width="12"/>
          </g>
        `,
      },
      {
        name: '6. Single Stroke',
        tag: '단일 획 · 미니멀',
        meaning: '하나의 연속된 획이 S→J→C로 흐르며 마치 한 번의 손글씨처럼 완성. 최소 요소.',
        svg: (color) => `
          <g fill="none" stroke="${color}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
            <path d="
              M 140 45
              C 90 40 75 75 110 95
              C 145 110 130 145 80 142
              M 110 95
              L 110 150
              Q 110 170 90 170
              M 145 70
              Q 95 70 95 110
              Q 95 150 145 150
            "/>
          </g>
        `,
      },
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('grid');
      designs.forEach((d, i) => {
        const num = i + 1;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="label">
            <span class="num">${num}</span>
            <span class="name">${d.name.replace(/^\d+\.\s*/, '')}</span>
            <span class="tag">${d.tag}</span>
          </div>
          <div class="preview">
            <div class="preview-small">
              <svg viewBox="0 0 200 200">${d.svg('url(#silver-d)')}</svg>
              <span class="size-label">28px</span>
            </div>
            <div class="preview-med">
              <svg viewBox="0 0 200 200">${d.svg('url(#silver-d)')}</svg>
              <span class="size-label">64px</span>
            </div>
            <div class="preview-large">
              <svg viewBox="0 0 200 200">${d.svg('url(#silver-d)')}</svg>
              <span class="size-label">130px</span>
            </div>
          </div>
          <div class="preview-context">
            <svg viewBox="0 0 200 200">${d.svg('url(#silver-dark)')}</svg>
            <span class="preview-context-label">밝은 배경</span>
          </div>
          <p class="desc">
            <span class="meaning">${d.meaning}</span>
          </p>
        `;
        grid.appendChild(card);
      });
    });
  </script>

  <div class="grid" id="grid"></div>

  <p class="pick">
    마음에 드는 번호를 알려주세요: <strong>1번 ~ 6번</strong><br>
    <small style="opacity:0.75; font-size:0.8rem;">
      이번엔 모든 글자가 SVG 곡선으로 그려진 커스텀 디자인입니다. 폰트 대비 무게감/굵기 자유로움.
    </small>
  </p>

</body>
</html>
