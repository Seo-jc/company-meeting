name = "meet-sig"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[placement]
mode = "smart"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "BUG_REPORTS"
class_name = "BugReportsDO"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BugReportsDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PresenceDO"]
